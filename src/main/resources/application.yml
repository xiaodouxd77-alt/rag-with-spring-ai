server:
  port: 8080
spring:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true  # 👈 加这一行
    show-sql: true
  sql:
    init:
      mode: never
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST-TIMEOUT:-1}
  application:
    name: rag
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  ai:
    retry:
      backoff:
        initial-interval: 2000
        max-interval: 10000
        multiplier: 4
      max-attempts: 2
    ollama:
      embedding:
        model: ${EMBEDDING_MODEL:bge-m3}
        options:
          top-k: ${OLLAMA_EMBEDDING_TOP-K:10}
          num-thread: ${EMBEDDINGS_NUM_THREAD:8}
          num-ctx: 1024
          num-batch: 768
          top-p: ${OLLAMA_EMBEDDING_TOP-P:0.5}
        enabled: true
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${CHAT_MODEL:qwen2.5:3b}
        options:
          num-ctx: ${CHAT_MODEL_CONTEXT_LENGTH:2048}
          num-batch: 768
          num-predict: 512
          num-thread: ${CHAT_NUM_THREAD:8}
          top-k: ${CHAT_TOP-K:40}
          top-p: ${CHAT_TOP-P:0.9}
          temperature: ${CHAT_TEMPERATURE:0.7}
    vectorstore:
      pgvector:
        index-type: ${VECTORSTORE_PGVECTOR_INDEX-TYPE:hnsw}
        dimensions: ${VECTORSTORE_PGVECTOR_DIMENSIONS:1024}
        distance-type: cosine_distance

#      milvus:
#        collection-name: ${MILVUS_COLLECTION_NAME:vector_store1}
#        embedding-dimension: ${MILVUS_EMBEDDING_DIM:768}
logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.ai.ollama: TRACE

database:
  init: ${DATABASE_INIT:true}
queries:
  top-k: ${QUERIES_TOP-K:5}